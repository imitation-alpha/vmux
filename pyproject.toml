[project]
name = "vmux-agent"
version = "0.1.0"
description = "Attention router for CLI coding-agent swarms in tmux—monitor and respond from your phone."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "imitation-alpha" }]
keywords = [
    "tmux", "claude-code", "codex", "gemini", "ai-agents", "coding-agents",
    "pwa", "remote-control", "fastapi", "terminal", "orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.139.0",
    "starlette>=1.3.1",    # GHSA-82w8-qh3p-5jfq: enforce bounded URL-encoded form parsing
    "uvicorn[standard]>=0.51.0",
    "pyyaml>=6.0",
    "regex>=2026.7.10",        # bounded-time matching (timeout=) for user-supplied detector patterns
]

[project.optional-dependencies]
# Optional APNs push support: pip install 'vmux-agent[push]'
push = ["httpx[http2]>=0.28.1", "PyJWT[crypto]>=2.8"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.21"]
docs = ["mkdocs-material>=9.6"]

[project.urls]
Homepage = "https://imitation-alpha.github.io/vmux/"
Documentation = "https://imitation-alpha.github.io/vmux/"
Repository = "https://github.com/imitation-alpha/vmux"
Issues = "https://github.com/imitation-alpha/vmux/issues"
Changelog = "https://github.com/imitation-alpha/vmux/blob/main/CHANGELOG.md"
Blog = "https://imitation-alpha.github.io/blog/orchestrating-coding-agents.html"

[project.scripts]
vmux = "vmux.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vmux"]

[tool.hatch.build.targets.sdist]
include = ["vmux", "tests", "config.example.yaml", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Real issues only (errors, pyflakes, import order) — not style modernization,
# to keep the contributor bar low on a deliberately small codebase.
select = ["E", "F", "I"]
ignore = ["E501"]   # long lines are fine here
