<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280" height="640" viewBox="0 0 1280 640" role="img"
     aria-labelledby="title description">
  <title id="title">vmux social preview</title>
  <desc id="description">Attention router for CLI coding-agent swarms in tmux, illustrated with the vmux phone interface.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a11"/>
      <stop offset="0.58" stop-color="#101827"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="phone-left">
      <rect x="826" y="106" width="220" height="478" rx="30"/>
    </clipPath>
    <clipPath id="phone-right">
      <rect x="1018" y="68" width="220" height="478" rx="30"/>
    </clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="1040" cy="325" rx="430" ry="410" fill="url(#glow)"/>
  <path d="M0 576 C250 520 500 624 760 552 C950 498 1110 510 1280 468 L1280 640 L0 640Z"
        fill="#0a84ff" opacity="0.07"/>

  <g transform="translate(72 66)">
    <rect width="76" height="76" rx="18" fill="#0b0e14" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="19" y="19" width="17" height="17" rx="5" fill="#34c759"/>
    <rect x="40" y="19" width="17" height="17" rx="5" fill="#ffd60a"/>
    <rect x="19" y="40" width="17" height="17" rx="5" fill="#0a84ff"/>
    <rect x="40" y="40" width="17" height="17" rx="5" fill="#ff3b30"/>
    <circle cx="48.5" cy="48.5" r="3" fill="#0b0e14"/>
  </g>
  <text x="168" y="124" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="48" font-weight="750" letter-spacing="-1">vmux</text>

  <g transform="translate(72 184)">
    <rect width="146" height="34" rx="17" fill="#ff3b30" fill-opacity="0.14"
          stroke="#ff6961" stroke-opacity="0.45"/>
    <circle cx="20" cy="17" r="5" fill="#ff453a"/>
    <text x="34" y="23" fill="#ff8a84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="15" font-weight="650">needs input</text>
  </g>

  <text x="72" y="286" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="55" font-weight="760" letter-spacing="-1.8">
    <tspan x="72" dy="0">Attention router for</tspan>
    <tspan x="72" dy="66">coding-agent swarms.</tspan>
  </text>
  <text x="74" y="448" fill="#b7c2d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="25" font-weight="450">
    <tspan x="74" dy="0">Monitor and respond from your phone.</tspan>
    <tspan x="74" dy="39">Local-first · tmux · Claude Code · Codex · Gemini</tspan>
  </text>

  <g filter="url(#shadow)">
    <rect x="816" y="96" width="240" height="498" rx="40" fill="#05070b"
          stroke="#ffffff" stroke-opacity="0.17" stroke-width="2"/>
    <image x="826" y="106" width="220" height="478" preserveAspectRatio="xMidYMid slice"
           href="../docs/images/panel-list-view.jpg" clip-path="url(#phone-left)"/>
    <rect x="900" y="101" width="72" height="5" rx="2.5" fill="#05070b" opacity="0.9"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1008" y="58" width="240" height="498" rx="40" fill="#05070b"
          stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <image x="1018" y="68" width="220" height="478" preserveAspectRatio="xMidYMid slice"
           href="../docs/images/panel-session-view.jpg" clip-path="url(#phone-right)"/>
    <rect x="1092" y="63" width="72" height="5" rx="2.5" fill="#05070b" opacity="0.9"/>
  </g>
</svg>
