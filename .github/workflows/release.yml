name: Release

# Before creating a tag, configure PyPI Trusted Publishing for:
#   project vmux-agent; repository imitation-alpha/vmux; workflow release.yml;
#   environment pypi.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
      - name: Require a current lockfile
        run: uv lock --check
      - name: Match the tag to pyproject.toml
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must have the form vX.Y.Z" >&2
            exit 1
          fi
          project_version="$(uv run --no-project python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$project_version" || {
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          }
      - name: Require release notes for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          CHANGELOG_VERSION="$version" uv run --no-project python - <<'PY'
          import datetime as dt
          import os
          import pathlib
          import re

          version = os.environ["CHANGELOG_VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          same_version = re.compile(
              rf"^## \[{re.escape(version)}\].*$",
              re.MULTILINE,
          )
          if len(list(same_version.finditer(text))) != 1:
              raise SystemExit(
                  f"CHANGELOG.md needs exactly one heading for version [{version}]"
              )
          heading = re.compile(
              rf"^## \[{re.escape(version)}\] - (?P<date>\d{{4}}-\d{{2}}-\d{{2}})$",
              re.MULTILINE,
          )
          matches = list(heading.finditer(text))
          if len(matches) != 1:
              raise SystemExit(
                  f"CHANGELOG.md needs exactly one '## [{version}] - YYYY-MM-DD' section"
              )
          try:
              dt.date.fromisoformat(matches[0].group("date"))
          except ValueError as exc:
              raise SystemExit(f"invalid release date: {exc}") from exc

          start = matches[0].end()
          next_section = re.search(r"^## \[", text[start:], re.MULTILINE)
          body = text[start:start + next_section.start()] if next_section else text[start:]
          body = re.sub(r"<!--.*?-->", "", body, flags=re.DOTALL)
          substantive = [
              line for line in body.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          if not substantive:
              raise SystemExit(f"CHANGELOG.md section [{version}] has no release notes")
          PY
      - name: Require the tagged commit to be on main
        run: |
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main || {
            echo "Tagged commit $tag_commit is not reachable from main" >&2
            exit 1
          }

  build:
    name: build and verify distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release-py3.13
      - name: Build wheel and source distribution once
        run: uv build
      - name: Inspect distribution contents and metadata
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import pathlib
          import tarfile
          import zipfile

          version = os.environ["RELEASE_VERSION"].removeprefix("v")
          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          source_web = {
              path.as_posix()
              for path in pathlib.Path("vmux/web").rglob("*")
              if path.is_file()
          }
          source_agents = {
              path.as_posix()
              for path in pathlib.Path("vmux/agents").rglob("*.py")
              if path.is_file()
          }
          required_agents = {
              "vmux/agents/__init__.py",
              "vmux/agents/controllers.py",
              "vmux/agents/models.py",
              "vmux/agents/observers.py",
              "vmux/agents/protocols.py",
              "vmux/agents/service.py",
              "vmux/agents/store.py",
          }
          required_web = {
              "vmux/web/index.html",
              "vmux/web/styles.css",
              "vmux/web/manifest.webmanifest",
              "vmux/web/sw.js",
              "vmux/web/icon.svg",
              "vmux/web/icon-180.png",
              "vmux/web/icon-192.png",
              "vmux/web/icon-512.png",
              "vmux/web/icon-maskable-512.png",
              "vmux/web/icons/lucide.svg",
              "vmux/web/icons/LUCIDE_LICENSE.txt",
              "vmux/web/js/agent-state.js",
              "vmux/web/js/agent-ui.js",
              "vmux/web/js/app.js",
              "vmux/web/js/core.js",
              "vmux/web/js/settings.js",
              "vmux/web/js/state.js",
              "vmux/web/js/ui.js",
              "vmux/web/js/usage.js",
              "vmux/web/vendor/htm.umd.js",
              "vmux/web/vendor/react-dom.production.min.js",
              "vmux/web/vendor/react.production.min.js",
          }
          assert not (required_agents - source_agents), sorted(required_agents - source_agents)
          assert not (required_web - source_web), sorted(required_web - source_web)

          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert not (source_agents - names), sorted(source_agents - names)
              assert not (source_web - names), sorted(source_web - names)
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
              assert "Name: vmux-agent\n" in metadata
              assert f"Version: {version}\n" in metadata
              assert "Requires-Python: >=3.10\n" in metadata
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = set(archive.getnames())
              for suffix in (
                  "config.example.yaml",
                  "LICENSE",
                  "README.md",
                  "pyproject.toml",
                  "vmux/web/index.html",
                  "vmux/web/vendor/react.production.min.js",
              ):
                  assert any(name.endswith("/" + suffix) for name in names), suffix
              for web_asset in source_web:
                  assert any(name.endswith("/" + web_asset) for name in names), web_asset
              for agent_module in source_agents:
                  assert any(name.endswith("/" + agent_module) for name in names), agent_module
              artifact_names = [name for name in names if "/tests/web/artifacts/" in f"/{name}"]
              assert not artifact_names, artifact_names
              assert any(name.endswith("/PKG-INFO") for name in names)

          print("OK:", wheels[0], "and", sdists[0])
          PY
      - name: Install the wheel in a clean environment
        run: |
          smoke="${RUNNER_TEMP}/vmux-release-smoke"
          uv venv --python 3.13 "$smoke"
          uv pip install --python "$smoke/bin/python" dist/*.whl
          expected_version="${GITHUB_REF_NAME#v}"
          test "$("$smoke/bin/vmux" --version)" = "vmux $expected_version"
          (
          cd "$smoke"
          "$smoke/bin/python" - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          import vmux
          import vmux.agents
          from vmux.config import Config
          from vmux.server import create_app

          web = Path(vmux.__file__).parent / "web"
          agents = Path(vmux.agents.__file__).parent
          assert vmux.__version__ == version("vmux-agent")
          app = create_app(Config(agent_store_path=str(Path.cwd() / "agent-smoke.sqlite3")))
          routes = {getattr(route, "path", "") for route in app.routes}
          assert "/api/agents" in routes
          assert "/ws/agents" in routes
          for relative in (
              "__init__.py",
              "models.py",
              "observers.py",
              "service.py",
              "store.py",
          ):
              assert (agents / relative).is_file(), relative
          for relative in (
              "index.html",
              "styles.css",
              "manifest.webmanifest",
              "sw.js",
              "icon-180.png",
              "icon-192.png",
              "icon-512.png",
              "icon-maskable-512.png",
              "icons/lucide.svg",
              "icons/LUCIDE_LICENSE.txt",
              "js/agent-state.js",
              "js/agent-ui.js",
              "js/app.js",
              "vendor/react.production.min.js",
          ):
              assert (web / relative).is_file(), relative
          print("OK: installed", version("vmux-agent"), "with agent context and static assets")
          PY
          )
      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vmux-agent
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-distributions
          path: dist/
      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version] - " '
            index($0, heading) == 1 {
              date = substr($0, length(heading) + 1)
              if (date ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/) {
                found = 1
                next
              }
            }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create the release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "vmux $version" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "vmux $version" \
              --notes-file release-notes.md
          fi
