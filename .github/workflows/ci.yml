name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Check that uv.lock is current
        run: uv lock --check

  tests:
    name: tests (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: tests-py${{ matrix.python-version }}
      - name: Install test dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run pytest -q

  macos:
    name: tests (macOS, Python 3.13)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: tests-py3.13
      - name: Install test dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run pytest -q

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: lint-py3.13
      - name: Install development dependencies
        run: uv sync --locked --group dev
      - run: uv run ruff check vmux tests

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: docs-py3.13
      - name: Install documentation dependencies
        run: uv sync --locked --group docs
      - name: Build documentation strictly
        run: uv run mkdocs build --strict

  package:
    name: distribution + clean-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: package-py3.13
      - name: Build wheel and source distribution
        run: uv build
      - name: Inspect distribution contents and metadata
        run: |
          uv run --no-project python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists

          source_web = {
              path.as_posix()
              for path in pathlib.Path("vmux/web").rglob("*")
              if path.is_file()
          }
          source_agents = {
              path.as_posix()
              for path in pathlib.Path("vmux/agents").rglob("*.py")
              if path.is_file()
          }
          required_agents = {
              "vmux/agents/__init__.py",
              "vmux/agents/controllers.py",
              "vmux/agents/models.py",
              "vmux/agents/observers.py",
              "vmux/agents/protocols.py",
              "vmux/agents/service.py",
              "vmux/agents/store.py",
          }
          required_web = {
              "vmux/web/index.html",
              "vmux/web/styles.css",
              "vmux/web/manifest.webmanifest",
              "vmux/web/sw.js",
              "vmux/web/icon.svg",
              "vmux/web/icon-180.png",
              "vmux/web/icon-192.png",
              "vmux/web/icon-512.png",
              "vmux/web/icon-maskable-512.png",
              "vmux/web/icons/lucide.svg",
              "vmux/web/icons/LUCIDE_LICENSE.txt",
              "vmux/web/js/agent-state.js",
              "vmux/web/js/agent-ui.js",
              "vmux/web/js/app.js",
              "vmux/web/js/core.js",
              "vmux/web/js/settings.js",
              "vmux/web/js/state.js",
              "vmux/web/js/ui.js",
              "vmux/web/js/usage.js",
              "vmux/web/vendor/htm.umd.js",
              "vmux/web/vendor/react-dom.production.min.js",
              "vmux/web/vendor/react.production.min.js",
          }
          assert not (required_agents - source_agents), sorted(required_agents - source_agents)
          assert not (required_web - source_web), sorted(required_web - source_web)

          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert not (source_agents - names), sorted(source_agents - names)
              assert not (source_web - names), sorted(source_web - names)
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()
              assert "Name: vmux-agent\n" in metadata
              assert "Requires-Python: >=3.10\n" in metadata
              assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)

          with tarfile.open(sdists[0], "r:gz") as archive:
              names = set(archive.getnames())
              for suffix in (
                  "config.example.yaml",
                  "LICENSE",
                  "README.md",
                  "pyproject.toml",
                  "vmux/web/index.html",
                  "vmux/web/vendor/react.production.min.js",
              ):
                  assert any(name.endswith("/" + suffix) for name in names), suffix
              for web_asset in source_web:
                  assert any(name.endswith("/" + web_asset) for name in names), web_asset
              for agent_module in source_agents:
                  assert any(name.endswith("/" + agent_module) for name in names), agent_module
              artifact_names = [name for name in names if "/tests/web/artifacts/" in f"/{name}"]
              assert not artifact_names, artifact_names
              assert any(name.endswith("/PKG-INFO") for name in names)

          print("OK:", wheels[0], "and", sdists[0])
          PY
      - name: Install the wheel in a clean environment
        run: |
          smoke="${RUNNER_TEMP}/vmux-smoke"
          uv venv --python 3.13 "$smoke"
          uv pip install --python "$smoke/bin/python" dist/*.whl
          expected_version="$(uv run --no-project python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$("$smoke/bin/vmux" --version)" = "vmux $expected_version"
          (
          cd "$smoke"
          "$smoke/bin/python" - <<'PY'
          from importlib.metadata import version
          from pathlib import Path

          import vmux
          import vmux.agents
          from vmux.config import Config
          from vmux.server import create_app

          web = Path(vmux.__file__).parent / "web"
          agents = Path(vmux.agents.__file__).parent
          assert vmux.__version__ == version("vmux-agent")
          app = create_app(Config(agent_store_path=str(Path.cwd() / "agent-smoke.sqlite3")))
          routes = {getattr(route, "path", "") for route in app.routes}
          assert "/api/agents" in routes
          assert "/ws/agents" in routes
          for relative in (
              "__init__.py",
              "models.py",
              "observers.py",
              "service.py",
              "store.py",
          ):
              assert (agents / relative).is_file(), relative
          for relative in (
              "index.html",
              "styles.css",
              "manifest.webmanifest",
              "sw.js",
              "icon-180.png",
              "icon-192.png",
              "icon-512.png",
              "icon-maskable-512.png",
              "icons/lucide.svg",
              "icons/LUCIDE_LICENSE.txt",
              "js/agent-state.js",
              "js/agent-ui.js",
              "js/app.js",
              "vendor/react.production.min.js",
          ):
              assert (web / relative).is_file(), relative
          print("OK: installed", version("vmux-agent"), "with agent context and static assets")
          PY
          )
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  browser:
    name: browser (Chromium + WebKit, Python 3.13)
    # Visual baselines are platform-specific. Keep this pinned to the same
    # macOS/arm64 generation used to review and update the screenshots.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: browser-py3.13
      - name: Install browser-test dependencies
        run: uv sync --locked --group dev --group web-test
      - name: Install pinned Playwright browsers
        run: uv run playwright install chromium webkit
      - name: Run Chromium and WebKit functional tests
        env:
          CI: "1"
          VMUX_WEB_BROWSERS: chromium,webkit
        run: uv run pytest -q tests/web/test_functional.py
      - name: Compare pinned-Chromium visual baselines
        env:
          CI: "1"
        run: uv run pytest -q tests/web/test_visual.py
      - name: Upload browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-artifacts
          path: tests/web/artifacts/
          if-no-files-found: warn

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [lockfile, tests, macos, lint, docs, package, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job to pass
        env:
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          for result in "$LOCKFILE_RESULT" "$TESTS_RESULT" "$MACOS_RESULT" "$LINT_RESULT" "$DOCS_RESULT" "$PACKAGE_RESULT" "$BROWSER_RESULT"; do
            test "$result" = "success"
          done
