<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#090b10" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="vmux" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
  <link rel="stylesheet" href="/styles.css" />
  <title>vmux</title>
  <script>
    // Resolve the saved theme before paint. Preferences are parsed again and
    // migrated by state.js; this tiny shell guard avoids a light/dark flash.
    (() => {
      try {
        const p = JSON.parse(localStorage.getItem("vmux_prefs") || "{}");
        const theme = p.theme || "auto";
        const dark = theme === "dark" ||
          (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "t-dark" : "t-light");
        if (p.glass === false) document.documentElement.classList.add("no-glass");
        if (p.ambient === false || p.ambient == null) document.documentElement.classList.add("no-ambient");
      } catch (_) {
        document.documentElement.classList.add(
          matchMedia("(prefers-color-scheme: dark)").matches ? "t-dark" : "t-light"
        );
      }
    })();
  </script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div id="root"></div>
  <noscript>vmux requires JavaScript to show your live tmux panes.</noscript>

  <!-- Vendored, same-origin runtime: no CDN and no build step. -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/htm.umd.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
