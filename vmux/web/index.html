<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="vmux" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icon.svg" />
<title>vmux</title>
<style>
  :root {
    --bg:#f2f2f7; --bg-elevated:#ffffff; --bg-secondary:#ffffff;
    --sidebar-bg:rgba(246,246,248,.8); --material:rgba(255,255,255,.72);
    --label:#1c1c1e; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.32);
    --separator:rgba(60,60,67,.2); --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.06);
    --accent:#007aff; --on-accent:#fff;
    --red:#ff3b30; --orange:#ff9500; --yellow:#c98a00; --green:#34c759; --gray:#8e8e93;
    --shadow:0 12px 48px rgba(0,0,0,.18);
    /* Liquid Glass */
    --glass-bg:rgba(255,255,255,.6); --glass-sheen:rgba(255,255,255,.5);
    --glass-rim:rgba(255,255,255,.75); --glass-shadow:0 8px 30px rgba(0,0,0,.12);
  }
  /* Dark tokens live on a class JS toggles, so theme can be Auto/Light/Dark.
     JS resolves "auto" from prefers-color-scheme and sets .t-dark / .t-light. */
  .t-dark {
    --bg:#000000; --bg-elevated:#1c1c1e; --bg-secondary:#2c2c2e;
    --sidebar-bg:rgba(28,28,30,.72); --material:rgba(30,30,30,.72);
    --label:#ffffff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3);
    --separator:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.14);
    --accent:#0a84ff;
    --red:#ff453a; --orange:#ff9f0a; --yellow:#ffd60a; --green:#30d158; --gray:#8e8e93;
    --shadow:0 12px 48px rgba(0,0,0,.55);
    /* Liquid Glass */
    --glass-bg:rgba(40,40,45,.5); --glass-sheen:rgba(255,255,255,.1);
    --glass-rim:rgba(255,255,255,.22); --glass-shadow:0 10px 36px rgba(0,0,0,.5);
  }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--label); overscroll-behavior:none; overflow-x:hidden;
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; -webkit-text-size-adjust:100%; }
  #root { height:100%; position:relative; z-index:0; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .spacer { flex:1; }

  /* Liquid Glass material — translucent, frosted, light-catching. Sheen is a
     gradient layered UNDER content so text contrast is untouched; the rim is an
     inset highlight. Applied only to the floating chrome (bars, sheet, palette). */
  .glass {
    background:linear-gradient(180deg, var(--glass-sheen), transparent 38%), var(--glass-bg);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-rim), inset 0 0 0 .5px rgba(255,255,255,.12);
  }

  /* Ambient backdrop — soft colour wash so the glass has something to tint/bend.
     Sits behind everything; restrained and slow. */
  .ambient { position:fixed; inset:0; z-index:-1; overflow:hidden; background:var(--bg); }
  .ambient::before { content:""; position:absolute; inset:-25%;
    background:
      radial-gradient(38% 34% at 18% 20%, color-mix(in srgb,var(--accent) 32%,transparent), transparent 70%),
      radial-gradient(36% 30% at 84% 14%, rgba(255,120,180,.20), transparent 70%),
      radial-gradient(42% 38% at 74% 86%, rgba(60,210,180,.16), transparent 70%),
      radial-gradient(40% 40% at 26% 88%, rgba(150,130,255,.18), transparent 70%);
    animation:drift 34s ease-in-out infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .ambient::before { animation:none; } }
  @keyframes drift { from { transform:translate(0,0) scale(1); } to { transform:translate(3%,2%) scale(1.12); } }

  .dot { width:9px; height:9px; border-radius:50%; background:var(--s,var(--gray)); flex:none; }
  .s-needs_input { --s:var(--red); } .s-error { --s:var(--orange); }
  .s-working { --s:var(--yellow); } .s-idle { --s:var(--green); } .s-offline { --s:var(--gray); }

  .pill-needs { background:var(--red); color:#fff; font-size:11px; font-weight:700; letter-spacing:.4px;
    text-transform:uppercase; padding:3px 8px; border-radius:20px; white-space:nowrap; }
  .pill-soft { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    letter-spacing:.3px; text-transform:uppercase; color:var(--label-2); white-space:nowrap; }

  .iconbtn { border:none; background:var(--fill); width:32px; height:32px; border-radius:50%;
    font-size:15px; display:flex; align-items:center; justify-content:center; flex:none; }
  .iconbtn:active { transform:scale(.92); }
  .conn { width:9px; height:9px; border-radius:50%; background:var(--gray); flex:none; transition:background .2s; }
  .conn.on { background:var(--green); box-shadow:0 0 6px var(--green); }

  /* shared detail body */
  .question { font-size:15px; font-weight:600; margin:0 0 12px; }
  .menu { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .opt { background:var(--fill); border:1px solid var(--separator); border-radius:10px;
    padding:9px 13px; font-size:14px; }
  .opt.sel { border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent); }
  .opt b { color:var(--accent); margin-right:6px; }
  @media (hover:hover){ .opt:hover { background:var(--fill-2); } }
  .output { font:12px/1.45 "SF Mono",ui-monospace,Menlo,monospace; background:var(--bg);
    color:var(--label-2); border:1px solid var(--separator); border-radius:10px; padding:12px;
    white-space:pre-wrap; word-break:break-word; max-height:46vh; overflow:auto; user-select:text; margin:0 0 14px; }
  .actions { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .keycap { background:var(--bg-secondary); border:1px solid var(--separator); border-radius:8px;
    padding:7px 11px; font-size:13px; min-width:42px; }
  .keycap:active { transform:translateY(1px); }
  @media (hover:hover){ .keycap:hover { background:var(--fill); } }
  .composer { display:flex; gap:8px; align-items:center; }
  .snip-wrap { position:relative; flex:none; }
  .snip-btn { width:42px; height:42px; border-radius:10px; background:var(--bg-secondary);
    border:1px solid var(--separator); font-size:17px; color:var(--label-2); }
  .snip-btn:active { transform:translateY(1px); }
  @media (hover:hover){ .snip-btn:hover { background:var(--fill); } }
  .snip-menu { position:absolute; bottom:calc(100% + 8px); left:0; min-width:180px; max-width:64vw;
    max-height:46vh; overflow:auto; padding:6px; border-radius:12px; background:var(--bg-elevated);
    border:1px solid var(--separator); box-shadow:var(--shadow); z-index:50; display:flex; flex-direction:column; gap:2px; }
  .snip-item { text-align:left; padding:9px 11px; border-radius:8px; font-size:14px; color:var(--label);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (hover:hover){ .snip-item:hover { background:var(--fill); } }
  .snip-item:active { background:var(--fill); }
  .snip-empty { padding:9px 11px; font-size:13px; color:var(--label-3); }
  .field { flex:1; background:var(--bg); border:1px solid var(--separator); border-radius:10px;
    padding:10px 12px; font-size:15px; color:var(--label); outline:none; }
  .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); }
  .btn { background:var(--fill); border:1px solid var(--separator); border-radius:10px; padding:9px 14px; font-size:14px; }
  .btn.accent { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn:active { transform:translateY(1px); }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; color:var(--label-3); gap:10px; font-size:15px; }
  .empty-glyph { font-size:42px; opacity:.5; }

  /* iOS grouped inset list */
  .ios-group { background:var(--bg-secondary); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .ios-row { display:flex; align-items:center; gap:12px; width:100%; border:none; background:transparent;
    padding:13px 16px; text-align:left; border-bottom:1px solid var(--separator); }
  .ios-row:last-child { border-bottom:none; }
  .ios-row:active { background:var(--fill); }
  .ios-row-key { width:24px; height:24px; border-radius:6px; background:var(--accent); color:#fff;
    font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
  .ios-row-label { flex:1; font-size:16px; }
  .ios-row-check { color:var(--accent); font-weight:700; }
  .chev { color:var(--label-3); }

  /* ===== macOS split view ===== */
  .mac { display:grid; grid-template-columns:248px 1fr; height:100%; }
  .sidebar { border-right:1px solid var(--separator); border-radius:0;
    display:flex; flex-direction:column; overflow:hidden; padding-top:env(safe-area-inset-top); }
  .sidebar-head { display:flex; align-items:center; gap:8px; padding:14px 16px 8px; }
  .sidebar-head .title { font-size:20px; font-weight:700; letter-spacing:0; }
  .sidebar-head .title b { color:var(--accent); }
  .search { padding:0 12px 8px; }
  .search-field { width:100%; background:var(--fill); border:none; border-radius:9px; padding:7px 10px;
    font-size:13px; color:var(--label); outline:none; }
  .seg { display:flex; gap:2px; margin:0 12px 8px; background:var(--fill); border-radius:9px; padding:2px; }
  .seg-btn { flex:1; border:none; background:transparent; border-radius:7px; padding:5px 6px; font-size:12px; color:var(--label-2); }
  .seg-btn.on { background:var(--bg-elevated); color:var(--label); box-shadow:0 1px 2px rgba(0,0,0,.14); }
  .source-list { flex:1; overflow:auto; padding:4px 8px 12px; }
  .group-head { display:flex; justify-content:space-between; font-size:11px; font-weight:700;
    letter-spacing:.5px; text-transform:uppercase; color:var(--label-3); padding:12px 8px 4px; }
  .src-row { display:flex; align-items:center; gap:8px; width:100%; border:none; background:transparent;
    border-radius:8px; padding:7px 8px; text-align:left; }
  @media (hover:hover){ .src-row:hover { background:var(--fill-2); } }
  .src-row.sel { background:var(--accent); color:#fff; }
  .src-row.sel .src-target { color:rgba(255,255,255,.8); }
  .src-row.sel .dot { box-shadow:0 0 0 2px rgba(255,255,255,.5); }
  .src-name { flex:1; min-width:0; font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .src-target { font-size:11px; color:var(--label-3); font-variant-numeric:tabular-nums; }
  .content { display:flex; flex-direction:column; min-width:0; background:var(--bg-elevated); }
  .content-toolbar { display:flex; align-items:center; gap:10px; border-radius:0;
    padding:calc(env(safe-area-inset-top) + 13px) 18px 13px; border-bottom:1px solid var(--separator); }
  .ct-title { min-width:0; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ct-meta { font-size:12px; color:var(--label-3); font-variant-numeric:tabular-nums; }
  .content-scroll { flex:1; overflow:auto; padding:18px; }

  /* ===== command center ===== */
  .mac.command-center { display:grid; grid-template-columns:minmax(260px,300px) minmax(340px,440px) minmax(0,1fr);
    height:100%; min-height:0; background:var(--bg); }
  .surface { min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden;
    border-right:1px solid var(--separator); }
  .swarm-nav { background:var(--sidebar-bg); padding-top:env(safe-area-inset-top); }
  .attention-queue { background:color-mix(in srgb,var(--bg-elevated) 82%,var(--bg)); }
  .pane-inspector { background:var(--bg-elevated); border-right:none; }
  .surface-head { flex:none; display:flex; align-items:center; gap:10px; padding:14px 16px 10px;
    border-bottom:1px solid var(--separator); }
  .surface-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    color:var(--label-3); }
  .surface-sub { margin-top:2px; font-size:12px; color:var(--label-3); font-variant-numeric:tabular-nums; }
  .brand { font-size:21px; font-weight:750; letter-spacing:0; line-height:1; }
  .brand b { color:var(--accent); }
  .surface-scroll { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:12px; }
  .nav-tools { flex:none; padding:10px 12px 8px; border-bottom:1px solid var(--separator); }
  .nav-tools .search { padding:0 0 8px; }
  .nav-tools .seg { margin:0 0 8px; }
  .nav-tools .sortrow { margin:0; }
  .status-strip { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; padding:10px 12px;
    border-bottom:1px solid var(--separator); }
  .stat-tile { min-width:0; background:var(--fill-2); border:1px solid var(--separator); border-radius:8px;
    padding:7px 8px; }
  .stat-num { display:block; font-size:17px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat-label { display:block; margin-top:2px; color:var(--label-3); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.35px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat-tile.s-needs_input .stat-num { color:var(--red); }
  .stat-tile.s-error .stat-num { color:var(--orange); }
  .stat-tile.s-working .stat-num { color:var(--yellow); }
  .nav-list .src-row { padding:8px; }
  .nav-list .group-head { padding-top:10px; }
  .queue-scroll { padding:12px; }
  .attention-card { width:100%; text-align:left; color:var(--label); background:var(--bg-secondary);
    border:.5px solid var(--separator); border-left:3px solid var(--s,var(--gray)); border-radius:10px;
    padding:12px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .attention-card.selected { box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 28%,transparent); }
  .attention-card:active { transform:scale(.995); }
  @media (hover:hover){ .attention-card:hover { background:color-mix(in srgb,var(--bg-secondary) 86%,var(--fill)); } }
  .attention-top { display:flex; align-items:center; gap:8px; min-width:0; }
  .attention-name { flex:1; min-width:0; font-size:15px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .attention-meta { margin:4px 0 8px; font-size:11.5px; color:var(--label-3); font-variant-numeric:tabular-nums; }
  .attention-copy { margin:0 0 10px; color:var(--label-2); font-size:13.5px; line-height:1.35; }
  .attention-card .menu { margin:0; }
  .attention-card .opt { padding:7px 10px; font-size:13px; max-width:100%; white-space:normal; text-align:left; }
  .attention-card .card-preview { margin-top:9px; max-height:96px; }
  .queue-empty { min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--label-3); gap:8px; padding:24px 12px; }
  .queue-empty .empty-glyph { font-size:34px; }
  .inspector-head { padding:calc(env(safe-area-inset-top) + 13px) 18px 13px; }
  .inspector-title-wrap { min-width:0; flex:1; }
  .inspector-title { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .inspector-scroll { flex:1; overflow:auto; padding:16px 18px 18px; }
  .inspector-meta-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:14px; }
  .meta-tile { min-width:0; background:var(--fill-2); border:1px solid var(--separator); border-radius:8px; padding:8px; }
  .meta-label { display:block; color:var(--label-3); font-size:10.5px; text-transform:uppercase; letter-spacing:.35px; }
  .meta-value { display:block; margin-top:3px; color:var(--label-2); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pane-inspector .output { max-height:none; height:min(52vh,520px); }
  @media (max-width:1180px){
    .mac.command-center { grid-template-columns:260px minmax(300px,380px) minmax(0,1fr); }
    .inspector-meta-grid { grid-template-columns:minmax(0,1fr); }
  }

  /* command palette */
  .palette-scrim { position:fixed; inset:0; background:rgba(0,0,0,.3); display:flex; justify-content:center;
    align-items:flex-start; padding-top:14vh; z-index:100; animation:fade .15s ease; }
  .palette { width:min(560px,92vw); border-radius:18px; overflow:hidden;
    animation:pop .18s cubic-bezier(.32,.72,0,1); }
  .palette-input { width:100%; border:none; background:transparent; padding:16px 18px; font-size:18px;
    color:var(--label); outline:none; border-bottom:1px solid var(--separator); }
  .palette-list { max-height:46vh; overflow:auto; padding:6px; }
  .palette-row { display:flex; align-items:center; gap:10px; width:100%; border:none; background:transparent;
    border-radius:9px; padding:10px 12px; text-align:left; }
  .palette-row.on { background:var(--accent); color:#fff; }
  .palette-row.on .pr-meta { color:rgba(255,255,255,.8); }
  .pr-name { flex:1; font-size:14px; font-weight:500; }
  .pr-meta { font-size:12px; color:var(--label-3); font-variant-numeric:tabular-nums; }
  .palette-empty { padding:18px; text-align:center; color:var(--label-3); }
  .palette-hint { padding:8px 14px; font-size:11px; color:var(--label-3); border-top:1px solid var(--separator); display:flex; gap:14px; }

  /* ===== iOS ===== */
  .ios { height:100%; display:flex; flex-direction:column; }
  .ios-nav { position:fixed; top:0; left:0; right:0; z-index:20; padding-top:env(safe-area-inset-top);
    height:calc(env(safe-area-inset-top)); display:flex; align-items:flex-end; justify-content:center;
    background:transparent; transition:background .2s,height .2s; pointer-events:none; }
  .ios-nav.small { border-radius:0; border-bottom:1px solid var(--separator);
    height:calc(env(safe-area-inset-top) + 44px); }
  .ios-nav-inline { font-size:17px; font-weight:600; opacity:0; transition:opacity .2s; padding-bottom:11px; }
  .ios-nav.small .ios-nav-inline { opacity:1; }
  .ios-scroll { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    padding-top:env(safe-area-inset-top); }
  .lt-row { display:flex; align-items:center; gap:10px; padding:6px 16px 2px; }
  .large-title { flex:1; font-size:34px; font-weight:700; letter-spacing:0; margin:0; }
  .ios-summary { display:flex; gap:8px; flex-wrap:wrap; padding:6px 16px 14px; }
  .chip { font-size:13px; font-weight:600; padding:5px 11px; border-radius:20px; color:var(--label-2); }
  .chip.s-needs_input { background:color-mix(in srgb,var(--red) 16%,transparent); color:var(--red); }
  .ios-grid { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; padding:0 16px; }
  @media (min-width:560px){ .ios-grid { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
  .ios-bottom-pad { height:calc(env(safe-area-inset-bottom) + 92px); }

  .card { background:var(--bg-elevated); border:.5px solid var(--separator); min-width:0;
    border-left:3px solid var(--s,var(--gray)); border-radius:14px; padding:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); transition:transform .12s; }
  .card:active { transform:scale(.98); }
  .card.s-needs_input { animation:pulse 1.6s ease-in-out infinite; }
  .card-top { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .card-name { flex:1; min-width:0; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-meta { font-size:12px; color:var(--label-3); margin-bottom:8px; font-variant-numeric:tabular-nums; }
  .card-q { font-size:14px; margin:6px 0 10px; }
  .card-preview { font:11px/1.4 "SF Mono",ui-monospace,Menlo,monospace; color:var(--label-3);
    background:var(--bg); border-radius:8px; padding:8px; max-height:78px; overflow:hidden;
    white-space:pre-wrap; word-break:break-word; margin-top:8px; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,59,48,0); } 50%{ box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 35%,transparent); } }

  .mobile-attention-home { min-height:100%; padding-bottom:calc(env(safe-area-inset-bottom) + 86px); }
  .mobile-hero { padding:6px 16px 10px; }
  .mobile-actions { display:flex; align-items:center; gap:8px; padding:0 16px 12px; }
  .mobile-actions .btn { flex:1; min-width:0; }
  .mobile-section { padding:0 16px 16px; }
  .mobile-section-head { display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:6px 0 8px; }
  .mobile-section-title { font-size:13px; font-weight:700; color:var(--label-3); text-transform:uppercase;
    letter-spacing:.4px; }

  const prev=useRef(new Set());
  useEffect(()=>{
    const watch = PREFS.alertErrors ? ["needs_input","error"] : ["needs_input"];
    const now=new Set(panes.filter(p=>watch.includes(p.status)).map(p=>p.id));
    let fresh=false; now.forEach(id=>{ if(!prev.current.has(id)) fresh=true; });
    if(fresh){
      beep();   // self-guards on PREFS.sound
      if(PREFS.notify && "Notification" in window && Notification.permission==="granted"){
        const who=panes.filter(p=>watch.includes(p.status)&&!prev.current.has(p.id)).map(p=>p.name).join(", ");
        try{ new Notification("vmux — needs you",{body:who}); }catch(e){}
      }
    }
    const needs = panes.filter(p=>p.status==="needs_input").length;
    document.title = needs? "("+needs+") vmux" : "vmux";
    prev.current=now;
  },[panes]);
}

function useIdiom(){
  const Q="(min-width:820px) and (pointer:fine)";
  const [mac,setMac]=useState(()=> window.matchMedia(Q).matches);
  useEffect(()=>{ const m=window.matchMedia(Q); const on=()=>setMac(m.matches);
    m.addEventListener("change",on); return ()=>m.removeEventListener("change",on); },[]);
  return mac?"mac":"ios";
}

function StatusPill({status, compact}){
  if(status==="needs_input") return html`<span class="pill-needs">Needs input</span>`;
  return html`<span class=${"pill-soft s-"+status}>${compact?null:html`<span class=${"dot s-"+status}></span>`}${STATUS_LABEL[status]}</span>`;
}

function StarBtn({pane}){
  return html`<span class=${"star-btn"+(pane.starred?" on":"")} title=${pane.starred?"Unstar":"Star"}
    onClick=${e=>{ e.stopPropagation(); act.star(pane); }}>${pane.starred?"★":"☆"}</span>`;
}

function Menu({pane, variant}){
  if(!pane.menu||!pane.menu.length) return null;
  const tap=(e,key)=>{ e.stopPropagation(); act.select(pane,key); };
  if(variant==="rows") return html`<div class="ios-group">
    ${pane.menu.map(o=>html`<button class="ios-row" key=${o.key} onClick=${e=>tap(e,o.key)}>
      <span class="ios-row-key">${o.key}</span>
      <span class="ios-row-label">${o.label}</span>
      ${o.selected ? html`<span class="ios-row-check">✓</span>` : html`<span class="chev">›</span>`}
    </button>`)}
  </div>`;
  return html`<div class="menu">
    ${pane.menu.map(o=>html`<button class=${"opt"+(o.selected?" sel":"")} key=${o.key}
      onClick=${e=>tap(e,o.key)}><b>${o.key}</b>${o.label}</button>`)}
  </div>`;
}

function Composer({pane}){
  const prefs=usePrefs();
  const [text,setText]=useState("");
  const [snipOpen,setSnipOpen]=useState(false);
  const send=(enter)=>{ if(!text&&!enter) return; act.text(pane,text,enter).then(()=>setText("")).catch(()=>{}); };
  const snippets=prefs.snippets||[];
  const pick=(s)=>{ setText(t=>t?t+s:s); setSnipOpen(false); };
  useEffect(()=>{ if(!snipOpen) return;
    const onDoc=(e)=>{ if(!e.target.closest||!e.target.closest(".snip-wrap")) setSnipOpen(false); };
    const onKey=(e)=>{ if(e.key==="Escape") setSnipOpen(false); };
    document.addEventListener("mousedown",onDoc); document.addEventListener("keydown",onKey);
    return ()=>{ document.removeEventListener("mousedown",onDoc); document.removeEventListener("keydown",onKey); };
  },[snipOpen]);
  return html`<div class="composer">
    <div class="snip-wrap">
      <button class="snip-btn" title="Snippets" onClick=${()=>setSnipOpen(o=>!o)} aria-label="Snippets">⧉</button>
      ${snipOpen && html`<div class="snip-menu glass">
        ${snippets.length
          ? snippets.map((s,i)=>html`<button class="snip-item" key=${i} onClick=${()=>pick(s)}>${s}</button>`)
          : html`<div class="snip-empty">No snippets — add in Settings</div>`}
      </div>`}
    </div>
    <input class="field" name="message" autocomplete="off" placeholder="Type a message…" value=${text}
      onInput=${e=>setText(e.target.value)}
      onKeyDown=${e=>{ if(e.key==="Enter"){ e.preventDefault(); send(true); } }} />
    <button class="btn" onClick=${()=>send(false)}>Send</button>
    <button class="btn accent" onClick=${()=>send(true)}>↵</button>
  </div>`;
}

function DetailBody({pane, variant}){
  const prefs=usePrefs();
  const actions=prefs.actions||DEFAULT_ACTIONS;
  const outRef=useRef();
  const stick=useRef(true);                                 // keep pinned to the newest output, like a real terminal
  const text=(pane.lines||[]).join("\n") || "(no output)";
  const toBottom=()=>{ const el=outRef.current; if(el) el.scrollTop=el.scrollHeight; };
  useEffect(()=>{ stick.current=true; toBottom(); },[pane.id]);   // jump to bottom when opening a pane
  useEffect(()=>{ if(stick.current) toBottom(); },[text]);        // follow new output unless the user scrolled up
  const onScroll=()=>{ const el=outRef.current; if(el) stick.current=(el.scrollHeight-el.scrollTop-el.clientHeight)<24; };
  return html`<${F}>
    ${pane.status==="needs_input" && pane.question && html`<div class="question">${pane.question}</div>`}
    <${Menu} pane=${pane} variant=${variant==="ios"?"rows":"buttons"} />
    <pre class="output" ref=${outRef} onScroll=${onScroll}>${text}</pre>
    <div class="actions">
      ${actions.map(([lbl,k],i)=>html`<button class="keycap" key=${i} onClick=${()=>act.key(pane,k)}>${lbl}</button>`)}
    </div>
    <${Composer} pane=${pane} />
  <//>`;
}

function timeAgo(ts){
  if(!ts) return "no activity";
  const s=Math.max(0,Math.round(Date.now()/1000-ts));
  if(s<5) return "now";
  if(s<60) return s+"s ago";
  if(s<3600) return Math.round(s/60)+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
function statusSort(a,b){ return (ORDER[a.status]-ORDER[b.status]) || ((b.starred?1:0)-(a.starred?1:0)) || ((b.updated||0)-(a.updated||0)) || cmpTarget(a,b); }
function attentionPanes(panes){ return panes.filter(p=>p.status==="needs_input"||p.status==="error").slice().sort(statusSort); }
function sortedPanes(panes, sort){ return panes.slice().sort((a,b)=> ((b.starred?1:0)-(a.starred?1:0)) || paneCmp(sort)(a,b)); }
function mobileModePanes(panes, mode, sort){
  if(mode==="queue") return attentionPanes(panes);
  if(mode==="active") return sortedPanes(panes.filter(p=>p.status==="working"), sort);
  return sortedPanes(panes, sort);
}
function previewText(pane){
  const lines=(pane.preview&&pane.preview.length?pane.preview:pane.lines)||[];
  return lines.slice(-5).join("\n");
}

function StatusStrip({counts}){
  const total=(counts.needs_input||0)+(counts.error||0)+(counts.working||0)+(counts.idle||0)+(counts.offline||0);
  const items=[["needs_input","Need",counts.needs_input||0],["error","Errors",counts.error||0],["working","Working",counts.working||0]];
  return html`<div class="status-strip">
    ${items.map(([s,l,n])=>html`<div class=${"stat-tile s-"+s} key=${s}>
      <span class="stat-num">${n}</span><span class="stat-label">${l}</span>
    </div>`)}
    ${total===0?null:html`<div class="stat-tile" style=${{display:"none"}}><span>${total}</span></div>`}
  </div>`;
}

function AttentionCard({pane, selected, onOpen, mobile}){
  const isNeed=pane.status==="needs_input";
  const copy = isNeed
    ? (pane.question || ((pane.menu&&pane.menu.length) ? "Choose an option to unblock this agent." : "Waiting for a reply."))
    : "Recent output matched an error pattern.";
  return html`<div class=${"attention-card s-"+pane.status+(selected?" selected":"")+(mobile?" mobile":"")}
    role="button" tabIndex="0" onClick=${()=>onOpen(pane.id)}
    onKeyDown=${e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); onOpen(pane.id); } }}>
    <div class="attention-top">
      <span class=${"dot s-"+pane.status}></span>
      <span class="attention-name">${pane.name}</span>
      <${StarBtn} pane=${pane} />
      <${StatusPill} status=${pane.status} compact=${true} />
    </div>
    <div class="attention-meta">${pane.target} · ${pane.kind} · ${timeAgo(Math.max(pane.updated||0,pane.interacted||0))}</div>
    <p class="attention-copy">${copy}</p>
    ${isNeed && pane.menu && pane.menu.length ? html`<${Menu} pane=${pane} />` : null}
    ${!isNeed && previewText(pane) ? html`<pre class="card-preview">${previewText(pane)}</pre>` : null}
    ${isNeed && (!pane.menu || !pane.menu.length) ? html`<button class="link-btn" onClick=${e=>{ e.stopPropagation(); onOpen(pane.id); }}>Reply in inspector</button>` : null}
  </div>`;
}

function Palette({panes,onPick,onClose}){
  const [q,setQ]=useState(""); const [i,setI]=useState(0); const ref=useRef();
  const list=useMemo(()=> panes.filter(p=>!q||(p.name+" "+p.target).toLowerCase().includes(q.toLowerCase()))
    .sort(byStatus).slice(0,8),[panes,q]);
  useEffect(()=>{ if(ref.current) ref.current.focus(); },[]);
  useEffect(()=>{ setI(0); },[q]);
  const onKey=(e)=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); setI(v=>Math.min(list.length-1,v+1)); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); setI(v=>Math.max(0,v-1)); }
    else if(e.key==="Enter"){ e.preventDefault(); if(list[i]) onPick(list[i].id); }
    else if(e.key==="Escape"){ e.preventDefault(); onClose(); }
  };
  return html`<div class="palette-scrim" onClick=${onClose}>
    <div class="palette glass" onClick=${e=>e.stopPropagation()}>
      <input ref=${ref} class="palette-input" name="palette" autocomplete="off" placeholder="Jump to agent…" value=${q}
        onInput=${e=>setQ(e.target.value)} onKeyDown=${onKey} />
      <div class="palette-list">
        ${list.map((p,idx)=>html`<button class=${"palette-row"+(idx===i?" on":"")} key=${p.id}
          onMouseEnter=${()=>setI(idx)} onClick=${()=>onPick(p.id)}>
          <span class=${"dot s-"+p.status}></span><span class="pr-name">${p.name}</span>
          <span class="pr-meta">${p.target}</span></button>`)}
        ${list.length===0 && html`<div class="palette-empty">No matches</div>`}
      </div>
      <div class="palette-hint"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span></div>
    </div>
  </div>`;
}

function SwarmNavigator({panes, connected, selId, onOpen, onBroadcast, onSettings}){
  const prefs=usePrefs();
  const [query,setQuery]=useState("");
  const counts=countOf(panes);
  const visible=useMemo(()=> panes.filter(p=> !query || (p.name+" "+p.target+" "+p.kind).toLowerCase().includes(query.toLowerCase())),[panes,query]);

  const groups=useMemo(()=>{
    const starred=visible.filter(p=>p.starred).sort(paneCmp(prefs.sort));
    const rest=visible.filter(p=>!p.starred);
    const out=[];
    if(starred.length) out.push({key:"starred", label:"Starred", items:starred});
    if(prefs.sort==="status"){
      for(const s of ["needs_input","error","working","idle","offline"]){
        const items=rest.filter(p=>p.status===s).sort((a,b)=>a.name.localeCompare(b.name));
        if(items.length) out.push({key:s, label:GROUP_LABEL[s], items});
      }
    } else if(rest.length){
      out.push({key:"all", label:SORT_LABEL[prefs.sort], items:rest.slice().sort(paneCmp(prefs.sort))});
    }
    return out;
  },[visible, prefs.sort]);

  return html`<aside class="swarm-nav surface glass">
    <div class="surface-head">
      <div>
        <div class="brand">v<b>mux</b></div>
        <div class="surface-sub">${connected?"Live swarm":"Reconnecting to server"}</div>
      </div>
      <div class="spacer"></div>
      <button class="iconbtn" title="Broadcast" onClick=${onBroadcast}>⇪</button>
      <button class="iconbtn" title="Settings" onClick=${onSettings}>⚙</button>
      <span class=${"conn"+(connected?" on":"")} title=${connected?"live":"reconnecting…"}></span>
    </div>
    <${StatusStrip} counts=${counts} />
    <div class="nav-tools">
      <div class="search"><input class="search-field" name="search" autocomplete="off" placeholder="Search swarm" value=${query} onInput=${e=>setQuery(e.target.value)} /></div>
      <div class="seg">
        ${[["tree","Tree"],["list","List"]].map(([v,l])=>html`
          <button class=${"seg-btn"+(prefs.view===v?" on":"")} key=${v} onClick=${()=>setPrefs({view:v})}>${l}</button>`)}
      </div>
      <div class="sortrow"><span class="sortrow-label">Sort</span>
        <select class="sortsel" name="sort" value=${prefs.sort} onChange=${e=>setPrefs({sort:e.target.value})}>
          ${SORTS.map(([v,l])=>html`<option key=${v} value=${v} selected=${prefs.sort===v}>${l}</option>`)}
        </select>
      </div>
    </div>
    <nav class="surface-scroll nav-list">
      ${prefs.view==="tree"
        ? html`<${TreeView} panes=${visible} onOpen=${onOpen} selId=${selId} />`
        : html`<${F}>
          ${groups.length===0 && html`<div class="palette-empty">${connected?"No matching panes":"Reconnecting…"}</div>`}
          ${groups.map(g=>html`<${F} key=${g.key}>
            <div class="group-head">${g.label}<span>${g.items.length}</span></div>
            ${g.items.map(p=>html`<${PaneMiniRow} key=${p.id} pane=${p} selected=${p.id===selId} onOpen=${onOpen} />`)}
          <//>`)}
        <//>`}
    </nav>
  </aside>`;
}

function MacApp({panes, connected, onBroadcast, onSettings}){
  const prefs=usePrefs();
  const [selId,setSel]=useState(null);
  const [palette,setPalette]=useState(false);
  const priority=useMemo(()=>{
    const urgent=attentionPanes(panes);
    const seen=new Set(urgent.map(p=>p.id));
    return urgent.concat(sortedPanes(panes.filter(p=>!seen.has(p.id)), prefs.sort));
  },[panes,prefs.sort]);

  useEffect(()=>{ if(selId && panes.some(p=>p.id===selId)) return; if(priority[0]) setSel(priority[0].id); },[priority,selId,panes]);
  const sel=panes.find(p=>p.id===selId)||null;

  useEffect(()=>{
    const onKey=(e)=>{
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); setPalette(v=>!v); return; }
      if(palette) return;
      const tag=(e.target.tagName||"").toLowerCase();
      if(tag==="input"||tag==="textarea") return;
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){
        e.preventDefault();
        const idx=priority.findIndex(p=>p.id===selId);
        const safeIdx=idx<0?0:idx;
        const ni=e.key==="ArrowDown"?Math.min(priority.length-1,safeIdx+1):Math.max(0,safeIdx-1);
        if(priority[ni]) setSel(priority[ni].id);
      } else if(sel && sel.menu && sel.menu.length && /^[0-9]$/.test(e.key)){
        const opt=sel.menu.find(o=>o.key===e.key); if(opt) act.select(sel,e.key);
      }
    };
    window.addEventListener("keydown",onKey);
    return ()=>window.removeEventListener("keydown",onKey);
  },[priority,selId,sel,palette]);

  return html`<div class="mac command-center">
    <${SwarmNavigator} panes=${panes} connected=${connected} selId=${selId} onOpen=${setSel} onBroadcast=${onBroadcast} onSettings=${onSettings} />
    <${AttentionQueue} panes=${panes} connected=${connected} selId=${selId} onOpen=${setSel} />
    <${PaneInspector} pane=${sel} connected=${connected} />
    ${palette && html`<${Palette} panes=${panes} onPick=${id=>{ setSel(id); setPalette(false); }} onClose=${()=>setPalette(false)} />`}
  </div>`;
}

/* ===================== iOS ===================== */
function MobileSheet({title, subtitle, onClose, children}){
  const [dy,setDy]=useState(0);
  const [closing,setClosing]=useState(false);
  const drag=useRef(null);
  const close=()=>{ setClosing(true); setTimeout(onClose,260); };
  const onDown=(e)=>{ drag.current=e.clientY; try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){} };
  const onMove=(e)=>{ if(drag.current==null) return; setDy(Math.max(0,e.clientY-drag.current)); };
  const onUp=(e)=>{ if(drag.current==null) return; const d=Math.max(0,e.clientY-drag.current); drag.current=null;
    if(d>120) close(); else setDy(0); };
  const style = closing ? {transform:"translateY(100%)"} : (dy ? {transform:"translateY("+dy+"px)", transition:"none"} : null);
  return html`<div class=${"sheet-scrim"+(closing?" closing":"")} onClick=${close}>
    <div class=${"sheet"+(closing?" closing":"")} style=${style} onClick=${e=>e.stopPropagation()}>
      <div class="sheet-grab-zone" onPointerDown=${onDown} onPointerMove=${onMove} onPointerUp=${onUp} onPointerCancel=${onUp}>
        <div class="grabber"></div>
        <div class="sheet-head">
          <div style=${{minWidth:0,flex:1}}>
            <div class="sheet-title">${title}</div>
            ${subtitle?html`<div class="sheet-subtitle">${subtitle}</div>`:null}
          </div>
          <button class="btn" onClick=${close}>Done</button>
        </div>
      </div>
      <div class="sheet-scroll">${children}</div>
    </div>
  </div>`;
}

function PaneDetailSheet({pane, onClose}){
  return html`<${MobileSheet} title=${pane.name} subtitle=${pane.target+" · "+pane.kind} onClose=${onClose}>
    <div style=${{display:"flex",alignItems:"center",gap:"10px",marginBottom:"12px"}}>
      <${StatusPill} status=${pane.status} />
      <${StarBtn} pane=${pane} />
      <div class="spacer"></div>
      <span class="surface-sub">Updated ${timeAgo(pane.updated)}</span>
    </div>
    <${DetailBody} pane=${pane} variant="ios" />
  <//>`;
}

function MobileAttentionHome({panes, connected, mode, onOpenDetail, onOpenTree, onBroadcast, onSettings}){
  const prefs=usePrefs();
  const counts=countOf(panes);
  const urgent=useMemo(()=>attentionPanes(panes),[panes]);
  const visible=useMemo(()=>mobileModePanes(panes,mode,prefs.sort),[panes,mode,prefs.sort]);
  const modeTitle = mode==="active" ? "Active" : (mode==="all" ? "All panes" : "Attention queue");
  return html`<div class="mobile-attention-home">
    <div class="lt-row mobile-hero">
      <h1 class="large-title">vmux</h1>
      <button class="iconbtn" title="Broadcast" onClick=${onBroadcast}>⇪</button>
      <button class="iconbtn" title="Settings" onClick=${onSettings}>⚙</button>
      <span class=${"conn"+(connected?" on":"")} title=${connected?"live":"reconnecting…"}></span>
    </div>
    <div class="ios-summary">
      <span class=${"chip glass"+((counts.needs_input||0)?" s-needs_input":"")}>${counts.needs_input||0} need you</span>
      <span class="chip glass">${counts.error||0} errors</span>
      <span class="chip glass">${counts.working||0} working</span>
      <span class="chip glass">${panes.length} panes</span>
    </div>

    <section class="mobile-section">
      <div class="mobile-section-head">
        <div class="mobile-section-title">${modeTitle}</div>
        ${mode==="queue"
          ? (urgent.length?html`<span class="chip s-needs_input">${urgent.length} urgent</span>`:html`<span class="chip">Clear</span>`)
          : mode==="active"
            ? html`<span class="chip">${visible.length} working</span>`
            : html`<select class="sortsel" name="sort" value=${prefs.sort} onChange=${e=>setPrefs({sort:e.target.value})}>
                ${SORTS.map(([v,l])=>html`<option key=${v} value=${v} selected=${prefs.sort===v}>${l}</option>`)}
              </select>`}
      </div>
      ${mode==="all" ? html`<div class="mobile-actions">
        <button class="btn" onClick=${onOpenTree}>Open tree</button>
        <button class="btn" onClick=${onBroadcast}>Broadcast</button>
      </div>` : null}
      ${!connected && panes.length===0 ? html`<div class="queue-empty"><div class="empty-glyph">⌁</div><div>Reconnecting</div><div class="surface-sub">Waiting for vmux state.</div></div>`
        : panes.length===0 ? html`<div class="queue-empty"><div class="empty-glyph">▦</div><div>No panes discovered</div><div class="surface-sub">The swarm tree will fill in as panes appear.</div></div>`
        : mode==="queue"
          ? (urgent.length===0
            ? html`<div class="queue-empty"><div class="empty-glyph">✓</div><div>No agents need attention</div><div class="surface-sub">Working panes are in Active. Everything else is in All.</div></div>`
            : urgent.map(p=>html`<${AttentionCard} key=${p.id} pane=${p} mobile=${true} onOpen=${onOpenDetail} />`))
          : visible.length===0
            ? html`<div class="queue-empty"><div class="empty-glyph">${mode==="active"?"◌":"▦"}</div><div>${mode==="active"?"No working panes":"No panes"}</div><div class="surface-sub">${mode==="active"?"Agents currently working will appear here.":"The full swarm appears here when panes are available."}</div></div>`
            : html`<div class="mobile-pane-list">
                ${visible.map(p=>html`<${MobilePaneRow} key=${p.id} pane=${p} onOpen=${onOpenDetail} />`)}
              </div>`}
    </section>
  </div>`;
}

function IOSApp({panes, connected, onBroadcast, onSettings}){
  const [openId,setOpen]=useState(null);
  const [sheetMode,setSheetMode]=useState(null);
  const [mobileMode,setMobileMode]=useState("queue");
  const [scrolled,setScrolled]=useState(false);
  const open=panes.find(p=>p.id===openId)||null;
  const openDetail=(id)=>{ setOpen(id); setSheetMode("detail"); };
  const counts=countOf(panes);
  const dockItems=[["queue","Queue",(counts.needs_input||0)+(counts.error||0)],["active","Active",counts.working||0],["all","All",panes.length]];
  const navTitle = mobileMode==="active" ? "Active" : (mobileMode==="all" ? "All" : "Queue");

  return html`<div class="ios">
    <div class=${"ios-nav"+(scrolled?" small glass":"")}><div class="ios-nav-inline">${navTitle}</div></div>
    <div class="ios-scroll" onScroll=${e=>setScrolled(e.target.scrollTop>34)}>
      <${MobileAttentionHome} panes=${panes} connected=${connected} mode=${mobileMode} onOpenDetail=${openDetail}
        onOpenTree=${()=>setSheetMode("tree")} onBroadcast=${onBroadcast} onSettings=${onSettings} />
    </div>
    <nav class="mobile-dock glass">
      ${dockItems.map(([mode,label,count])=>html`<button class=${"tab"+(mobileMode===mode?" on":"")} key=${mode} onClick=${()=>setMobileMode(mode)}>
        ${label}${count?html` <b>${count}</b>`:null}
      </button>`)}
    </nav>
    ${sheetMode==="tree" && html`<${MobileSheet} title="Swarm tree" subtitle=${panes.length+" panes"} onClose=${()=>setSheetMode(null)}>
      <div class="ios-tree"><${TreeView} panes=${panes} onOpen=${id=>{ setOpen(id); setSheetMode("detail"); }} /></div>
    <//>`}
    ${sheetMode==="detail" && open && html`<${PaneDetailSheet} pane=${open} onClose=${()=>{ setSheetMode(null); setOpen(null); }} />`}
  </div>`;
}

function BroadcastModal({panes, onClose}){
  const [text,setText]=useState(""); const [scope,setScope]=useState("needs");
  const inScope=(p,s)=> s==="all"||(s==="needs"&&p.status==="needs_input")||(s==="working"&&p.status==="working");
  const ids=panes.filter(p=>inScope(p,scope)).map(p=>p.id);
  const send=()=>{ if(!text||!ids.length) return; api("/broadcast",{ids,text,enter:true}).then(onClose).catch(()=>{}); };
  return html`<div class="modal-scrim" onClick=${onClose}>
    <div class="modal glass" onClick=${e=>e.stopPropagation()}>
      <div class="modal-title">Broadcast</div>
      <div class="seg" style=${{margin:"0 0 12px"}}>
        ${[["all","All"],["needs","Needs you"],["working","Working"]].map(([s,l])=>html`
          <button class=${"seg-btn"+(scope===s?" on":"")} key=${s} onClick=${()=>setScope(s)}>
            ${l} (${panes.filter(p=>inScope(p,s)).length})</button>`)}
      </div>
      <textarea class="modal-text" name="broadcast" placeholder=${"Message to "+ids.length+" agent(s)…"} value=${text}
        onInput=${e=>setText(e.target.value)}></textarea>
      <div class="modal-actions">
        <button class="btn" onClick=${onClose}>Cancel</button>
        <button class="btn accent" onClick=${send}>Send to ${ids.length}</button>
      </div>
    </div>
  </div>`;
}

function TokenGate(){
  const [val,setVal]=useState("");
  const save=()=>{ const t=val.trim(); if(!t) return; localStorage.setItem("vmux_token",t); location.href=location.pathname; };
  return html`<div class="gate">
    <div class="gate-card glass">
      <div class="gate-logo">v<b>mux</b></div>
      <div class="gate-title">Access token required</div>
      <div class="gate-sub">This vmux is token-protected. Paste its token to connect, or open the link that includes <code>?token=…</code></div>
      <input class="gate-input" type="password" name="token" autocomplete="off" placeholder="paste token…"
        value=${val} onInput=${e=>setVal(e.target.value)} onKeyDown=${e=>{ if(e.key==="Enter") save(); }} />
      <button class="btn accent gate-btn" onClick=${save}>Connect</button>
    </div>
  </div>`;
}

/* ===================== Settings ===================== */
function Switch({on, onChange}){
  return html`<label class="switch">
    <input type="checkbox" checked=${!!on} onChange=${e=>onChange(e.target.checked)} />
    <span class="track"></span><span class="knob"></span>
  </label>`;
}
function Seg({value, options, onChange}){
  return html`<div class="seg">
    ${options.map(([v,l])=>html`<button class=${"seg-btn"+(value===v?" on":"")} key=${v} onClick=${()=>onChange(v)}>${l}</button>`)}
  </div>`;
}
function Row({label, sub, children}){
  return html`<div class="set-row">
    <div class="set-col"><div class="set-label">${label}</div>${sub?html`<div class="set-sub">${sub}</div>`:null}</div>
    ${children}
  </div>`;
}

function useServerConfig(){
  const [cfg,setCfg]=useState(null);
  const [err,setErr]=useState("");
  useEffect(()=>{ api("/config").then(setCfg).catch(()=>setErr("Couldn't load server config")); },[]);
  const patch=async(partial)=>{ setErr("");
    try{ const d=await api("/config",partial,"PATCH"); setCfg(d); return true; }
    catch(e){ setErr(String(e.message||e)); return false; } };
  return {cfg,err,patch};
}

function PatternEditor({label, value, onSave}){
  const [text,setText]=useState(value.join("\n"));
  const save=()=>onSave(text.split("\n").map(s=>s.trim()).filter(Boolean));
  return html`<div class="set-group" style=${{padding:"12px 14px"}}>
    <div class="set-sub" style=${{marginBottom:"6px"}}>${label}</div>
    <textarea class="set-area" value=${text} onInput=${e=>setText(e.target.value)}></textarea>
    <div style=${{display:"flex",justifyContent:"flex-end",marginTop:"8px"}}>
      <button class="btn accent" onClick=${save}>Save</button>
    </div>
  </div>`;
}

function ServerSettings({cfg, err, patch, panes}){
  const setPoll=(d)=>patch({poll_interval: Math.round((cfg.poll_interval + d)*10)/10});
  const ovMap={}; cfg.overrides.forEach(o=>ovMap[o.target]=o);
  const targets = Array.from(new Set([
    ...((cfg._info&&cfg._info.targets)||[]), ...cfg.overrides.map(o=>o.target), ...panes.map(p=>p.target),
  ])).sort();
  const editAgent=(target, change)=>{
    const cur = ovMap[target] || {target,name:null,kind:null,star:false};
    const next = {...cur, ...change};
    const others = cfg.overrides.filter(o=>o.target!==target).map(o=>({target:o.target,name:o.name,kind:o.kind,star:o.star}));
    const keep = next.name || next.kind || next.star;
    patch({overrides: keep ? [...others, {target, name:next.name||null, kind:next.kind||null, star:!!next.star}] : others});
  };
  return html`<${F}>
    <div class="set-group-title">Server · General</div>
    <div class="set-group">
      <${Row} label="Poll interval" sub="how often panes are read">
        <div class="set-stepper">
          <button onClick=${()=>setPoll(-0.1)}>−</button>
          <span class="val">${cfg.poll_interval.toFixed(1)}s</span>
          <button onClick=${()=>setPoll(0.1)}>+</button>
        </div>
      <//>
      <${Row} label="Auto-discover panes"><${Switch} on=${cfg.auto_discover} onChange=${v=>patch({auto_discover:v})} /><//>
      <${Row} label="Show idle shells"><${Switch} on=${cfg.include_shells} onChange=${v=>patch({include_shells:v})} /><//>
      <${Row} label="Pane name" sub="default source — manual renames always win">
        <${Seg} value=${cfg.naming_mode||"title"}
          options=${[["title","Task"],["window","Window"],["target","ID"],["command","Cmd"]]}
          onChange=${v=>patch({naming_mode:v})} />
      <//>
    </div>

    <div class="set-group-title">Server · Agents</div>
    <div class="set-group">
      ${targets.length===0 ? html`<div class="set-row"><span class="set-sub">No panes yet.</span></div>`
        : targets.map(t=>{ const o=ovMap[t]||{}; return html`<div class="set-row" key=${t} style=${{flexWrap:"wrap"}}>
          <div class="set-col">
            <input class="set-input" style=${{width:"100%"}} placeholder=${t} value=${o.name||""}
              onChange=${e=>editAgent(t,{name:e.target.value.trim()||null})} />
          </div>
          <${Seg} value=${o.kind||"auto"} options=${[["auto","Auto"],["claude-code","Claude"],["generic","Gen"],["shell","Sh"]]}
            onChange=${v=>editAgent(t,{kind:v==="auto"?null:v})} />
          <label class="set-star"><span>Star</span><${Switch} on=${!!o.star} onChange=${v=>editAgent(t,{star:v})} /></label>
        </div>`; })}
    </div>

    <div class="set-group-title">Server · Detectors</div>
    <${PatternEditor} label="Prompt patterns — one regex per line" value=${cfg.generic_prompt_patterns}
      onSave=${pats=>patch({generic_prompt_patterns:pats})} />
    <${PatternEditor} label="Error patterns — one regex per line" value=${cfg.error_patterns}
      onSave=${pats=>patch({error_patterns:pats})} />
    ${err && html`<div class="set-err">${err}</div>`}
  <//>`;
}

function prettyUA(ua){
  if(!ua) return "Unknown device";
  if(/iPhone/.test(ua)) return "iPhone";
  if(/iPad/.test(ua)) return "iPad";
  if(/Android/.test(ua)) return "Android";
  if(/Macintosh|Mac OS X/.test(ua)) return /CriOS|Chrome/.test(ua) ? "Mac · Chrome" : (/Safari/.test(ua) ? "Mac · Safari" : "Mac");
  if(/Windows/.test(ua)) return "Windows";
  if(/Linux/.test(ua)) return "Linux";
  return ua.slice(0,24);
}
function fmtAge(s){ s=Math.max(0,Math.round(s)); if(s<60) return s+"s"; if(s<3600) return Math.round(s/60)+"m"; return Math.round(s/3600)+"h"; }

function SessionsSection(){
  const [list,setList]=useState(null);
  const load=()=>api("/sessions").then(d=>setList(d.sessions)).catch(()=>setList([]));
  useEffect(()=>{ load(); const t=setInterval(load,3000); return ()=>clearInterval(t); },[]);
  const kill=(id)=>api("/sessions/kill",{id}).then(load).catch(()=>{});
  const n = list?list.length:0;
  return html`<${F}>
    <div class="set-group-title">Connected sessions${list?" ("+n+")":""}</div>
    <div class="set-group">
      ${!list ? html`<div class="set-row"><span class="set-sub">Loading…</span></div>`
        : n===0 ? html`<div class="set-row"><span class="set-sub">No active sessions.</span></div>`
        : list.map(s=>html`<div class="set-row" key=${s.id}>
            <div class="set-col">
              <div class="set-label">${prettyUA(s.ua)}${s.id===MY_SID?html`<span class="self-tag">This device</span>`:null}</div>
              <div class="set-sub">${s.ip} · connected ${fmtAge(s.age)} ago</div>
            </div>
            <button class="link-btn danger" onClick=${()=>kill(s.id)}>Disconnect</button>
          </div>`)}
    </div>
  <//>`;
}

// immutable array helpers for the list editors
const arrMove=(a,i,d)=>{ const j=i+d; if(j<0||j>=a.length) return a; const b=a.slice(); const t=b[i]; b[i]=b[j]; b[j]=t; return b; };
const arrRemove=(a,i)=> a.filter((_,k)=>k!==i);
const arrSet=(a,i,v)=> a.map((x,k)=>k===i?v:x);

function ShortcutEditor({prefs, allowedKeys}){
  const actions=prefs.actions||DEFAULT_ACTIONS;
  const save=(next)=>setPrefs({actions:next});
  return html`<${F}>
    <div class="set-group-title">Shortcut buttons</div>
    <div class="set-group">
      ${actions.map(([lbl,k],i)=>html`<div class="set-row kb-edit-row" key=${i}>
        <input class="set-input kb-label" placeholder="Label" value=${lbl}
          onInput=${e=>save(arrSet(actions,i,[e.target.value,k]))} />
        <select class="set-input kb-key" value=${k} onChange=${e=>save(arrSet(actions,i,[lbl,e.target.value]))}>
          ${allowedKeys.map(ak=>html`<option key=${ak} value=${ak} selected=${ak===k}>${ak}</option>`)}
        </select>
        <button class="iconbtn kb-mini" title="Move up" disabled=${i===0} onClick=${()=>save(arrMove(actions,i,-1))}>↑</button>
        <button class="iconbtn kb-mini" title="Move down" disabled=${i===actions.length-1} onClick=${()=>save(arrMove(actions,i,1))}>↓</button>
        <button class="iconbtn kb-mini danger" title="Remove" onClick=${()=>save(arrRemove(actions,i))}>×</button>
      </div>`)}
      <div class="set-row kb-foot">
        <button class="link-btn" onClick=${()=>save([...actions,["Key","Enter"]])}>+ Add button</button>
        <div class="spacer"></div>
        <button class="link-btn" onClick=${()=>save(DEFAULT_ACTIONS)}>Reset to default</button>
      </div>
    </div>
  <//>`;
}

function SnippetEditor({prefs}){
  const snippets=prefs.snippets||DEFAULT_SNIPPETS;
  const save=(next)=>setPrefs({snippets:next});
  return html`<${F}>
    <div class="set-group-title">Snippets</div>
    <div class="set-group">
      ${snippets.map((s,i)=>html`<div class="set-row kb-edit-row" key=${i}>
        <input class="set-input kb-label" placeholder="Snippet text" value=${s}
          onInput=${e=>save(arrSet(snippets,i,e.target.value))} />
        <button class="iconbtn kb-mini" title="Move up" disabled=${i===0} onClick=${()=>save(arrMove(snippets,i,-1))}>↑</button>
        <button class="iconbtn kb-mini" title="Move down" disabled=${i===snippets.length-1} onClick=${()=>save(arrMove(snippets,i,1))}>↓</button>
        <button class="iconbtn kb-mini danger" title="Remove" onClick=${()=>save(arrRemove(snippets,i))}>×</button>
      </div>`)}
      <div class="set-row kb-foot">
        <button class="link-btn" onClick=${()=>save([...snippets,""])}>+ Add snippet</button>
        <div class="spacer"></div>
        <button class="link-btn" onClick=${()=>save(DEFAULT_SNIPPETS)}>Reset to default</button>
      </div>
    </div>
  <//>`;
}

function SettingsContent({panes}){
  const prefs=usePrefs();
  const {cfg,err,patch}=useServerConfig();
  const allowedKeys=(cfg&&cfg._info&&cfg._info.allowed_keys)||FALLBACK_KEYS;
  const reAuth=()=>{ localStorage.removeItem("vmux_token"); location.href=location.pathname; };
  return html`<div class="settings-body">
    <div class="set-group-title">Appearance</div>
    <div class="set-group">
      <${Row} label="Theme"><${Seg} value=${prefs.theme}
        options=${[["auto","Auto"],["light","Light"],["dark","Dark"]]} onChange=${v=>setPrefs({theme:v})} /><//>
      <${Row} label="Liquid Glass" sub="translucent bars & sheets"><${Switch} on=${prefs.glass} onChange=${v=>setPrefs({glass:v})} /><//>
      <${Row} label="Ambient motion" sub="moving background — off saves battery"><${Switch} on=${prefs.ambient} onChange=${v=>setPrefs({ambient:v})} /><//>
    </div>

    <div class="set-group-title">Notifications</div>
    <div class="set-group">
      <${Row} label="System notifications"><${Switch} on=${prefs.notify} onChange=${v=>{ setPrefs({notify:v}); if(v) askNotify(); }} /><//>
      <${Row} label="Sound"><${Switch} on=${prefs.sound} onChange=${v=>setPrefs({sound:v})} /><//>
      <${Row} label="Also alert on errors" sub="not just needs-input"><${Switch} on=${prefs.alertErrors} onChange=${v=>setPrefs({alertErrors:v})} /><//>
    </div>

    <div class="set-group-title">Display</div>
    <div class="set-group">
      <${Row} label="Default filter"><${Seg} value=${prefs.defaultFilter}
        options=${[["all","All"],["needs","Needs"],["working","Work"]]} onChange=${v=>setPrefs({defaultFilter:v})} /><//>
    </div>

    <${ShortcutEditor} prefs=${prefs} allowedKeys=${allowedKeys} />
    <${SnippetEditor} prefs=${prefs} />

    ${cfg ? html`<${ServerSettings} cfg=${cfg} err=${err} patch=${patch} panes=${panes} />`
          : html`<${F}><div class="set-group-title">Server</div><div class="set-sub" style=${{padding:"4px"}}>${err||"Loading…"}</div><//>`}

    <${SessionsSection} />

    <div class="set-group-title">Connection</div>
    <div class="set-group">
      <${Row} label="Server"><span class="set-sub">${location.host}</span><//>
      <${Row} label="Access token"><button class="link-btn" onClick=${reAuth}>Change…</button><//>
      <${Row} label="Sign out" sub="clear token on this device"><button class="link-btn danger" onClick=${reAuth}>Sign out</button><//>
    </div>
  </div>`;
}

function SettingsOverlay({idiom, panes, onClose}){
  return html`<div class="settings-scrim" onClick=${onClose}>
    <div class=${"settings-panel glass "+idiom} onClick=${e=>e.stopPropagation()}>
      <div class="settings-head">
        <div class="settings-title">Settings</div>
        <button class="btn accent" onClick=${onClose}>Done</button>
      </div>
      <${SettingsContent} panes=${panes} />
    </div>
  </div>`;
}

function App(){
  const { panes, status } = useSwarm();
  const idiom = useIdiom();
  const [bc,setBc]=useState(false);
  const [settings,setSettings]=useState(false);
  useNeedsNotify(panes);
  if(status==="unauthorized") return html`<${TokenGate} />`;
  const connected = status==="live";
  const onBroadcast=()=>setBc(true), onSettings=()=>setSettings(true);
  return html`<${F}>
    ${idiom==="mac"
      ? html`<${MacApp} panes=${panes} connected=${connected} onBroadcast=${onBroadcast} onSettings=${onSettings} />`
      : html`<${IOSApp} panes=${panes} connected=${connected} onBroadcast=${onBroadcast} onSettings=${onSettings} />`}
    ${bc && html`<${BroadcastModal} panes=${panes} onClose=${()=>setBc(false)} />`}
    ${settings && html`<${SettingsOverlay} idiom=${idiom} panes=${panes} onClose=${()=>setSettings(false)} />`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", ()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
}
</script>
