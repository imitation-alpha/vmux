# vmux config — every field is optional. With no config at all, vmux
# auto-discovers every tmux pane and classifies it. Copy to config.yaml to tweak.

server:
  host: 127.0.0.1     # reach over SSH tunnel or Tailscale. 0.0.0.0 REQUIRES a token.
  port: 8787
  token: ""           # set a long random string for LAN mode

poll_interval: 0.7    # seconds between tmux capture passes
capture_lines: 200    # lines of scrollback captured per pane for the detail view (40–2000)
naming_mode: session_window_pane  # pane names default to session:window:pane
                                  # also: pane, window_pane, session_pane,
                                  # title, window, target, command, smart

tmux:
  disable_auto_rename: true  # set tmux automatic-rename off at startup

# Optional smart pane naming. Set `naming_mode: smart` to use local heuristics
# inspired by auto-naming-tmux: shells show the directory, editors show
# command:directory, agents prefer useful pane titles, and ssh shows ssh:<host>
# when vmux can read the ssh argv.
#
# The AI layer is off by default because it sends recent pane output to the
# configured backend. These fields are YAML-only and are not exposed in Settings.
# auto_naming:
#   ai_enabled: false
#   ai_backend: claude          # claude | local | codex | agy | antigravity
#   ai_programs: claude,node,python,bun,deno,codex,agy
#   prefix_apps:
#     claude: cc
#     node: node
#     codex: cx
#     agy: ay
#     antigravity: ay
#     opencode: oc
#     oc: oc
#   max_len: 24
#   timeout: 60
#   system_prompt: ""          # empty = built-in prompt
#   claude_bin: claude
#   claude_model: haiku
#   local_url: http://localhost:8080/v1/chat/completions
#   local_model: default
#   local_api_key: ""
#   codex_bin: codex
#   codex_model: ""
#   antigravity_bin: agy
#   antigravity_model: ""
#   antigravity_flags: []      # list preferred, e.g. ["--sandbox"]

discovery:
  auto: true          # discover all panes automatically
  include_shells: false   # set true to also show plain idle shells

# Optional per-pane overrides / starred panes. A target listed here is always
# shown; starred panes stay near the top and remain visible if they go offline.
panes:
  # - target: "work:1.1"        # session:window.pane (see `tmux list-panes -a`)
  #   name: "API refactor"
  #   kind: claude-code         # claude-code | generic | shell
  #   star: true

# Optional APNs push for registered mobile clients.
# Requires the extra deps:  pip install 'vmux-agent[push]'
# Store key material outside the repo and keep config.yaml local.
# Full walkthrough: docs/PUSH_NOTIFICATIONS.md — note APNs keys are team-scoped,
# so self-hosted push works only with an app you build yourself.
# push:
#   apns_key_path: <APNS_KEY_PATH>
#   apns_key_id: <KEY_ID>
#   apns_team_id: <TEAM_ID>
#   apns_topic: <BUNDLE_ID>        # must equal the receiving app's bundle id
#   environment: sandbox           # sandbox = Xcode builds, production = TestFlight/App Store
#   on_error: false                # also push on error status, not just needs_input
#   cooldown: 30                   # min seconds between pushes for the same pane

# Optional token-usage + quota tracking via tokscale (https://github.com/junhoyeo/tokscale).
# Powers the usage API: remaining provider quotas, usage history, daily summary.
# Install tokscale yourself:  npm i -g tokscale   (or: bun i -g tokscale)
# vmux deliberately never auto-downloads it, and tracking is off unless enabled here
# or in Settings. How-to: QUICKSTART.md, "Optional: usage & quota tracking".
# usage:
#   enabled: true
#   command: tokscale       # if vmux runs under launchd/systemd it may not see your
#                           # shell PATH — use an absolute path, e.g. ~/.bun/bin/tokscale
#   quota_refresh: 180      # seconds between provider-quota checks (`tokscale usage`)
#   report_refresh: 300     # seconds between usage scans (CPU-heavy, keep >= 60)
#   alert_threshold: 20     # server push when a quota drops below this % (0 disables;
#                           # needs the push: section above to be configured)

# Detector tuning for non-Claude agents (regex).
detectors:
  generic_prompt_patterns:
    - "\\(y/n\\)"
    - "\\[Y/n\\]"
    - "Do you want to"
    - "Press enter to"
    - "Continue\\?"
  error_patterns:
    - "Traceback \\(most recent call last\\)"
    - "^\\s*Error:"
    - "panic:"
    - "fatal:"
